[package]
name = "loadman"
version = "0.1.1"
edition = "2024"
description = "Fast load testing for Postman collections: ramp-up, spike and peak profiles, pm.test scripts, CI thresholds and HTML reports."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["load-testing", "postman", "performance", "benchmark", "http"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anyhow = "1.0.104"
async-compression = { version = "0.4.50", features = ["tokio", "gzip", "brotli", "zstd", "zlib"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
fastrand = "2.5.0"
hdrhistogram = "7.6.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "tokio"] }
libc = "0.2.190"
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "http2", "zstd"] }
rquickjs = "0.14.0"
# The same versions and features reqwest's `rustls` feature already builds.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12"] }
tower-service = "0.3.3"
webpki-root-certs = "1.0.9"

[dev-dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "http2"] }
tokio = { version = "1.53.3", features = ["net", "rt-multi-thread", "macros"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 1
lto = "thin"
