name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee test-output.txt
      # One annotation per failed test (name, panic location, left/right),
      # visible on the run page without opening the log.
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          awk '/^---- .* stdout ----$/ { if (msg) print msg; msg = $2; n = 0; next }
               msg && n < 6 && (after_panic || /panicked at|^assertion|left:|right:|[Ee]rror/) {
                 gsub(/%/, "%25"); msg = msg "%0A" $0; n++ }
               { after_panic = /panicked at/ }
               /^failures:$/ { if (msg) print msg; msg = "" }
               END { if (msg) print msg }' test-output.txt | head -10 |
            while IFS= read -r m; do printf "::error title=cargo test failed::%s\n" "$m"; done

  # Installs the latest release with the repository's own action and runs it
  # against a local web server.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Start a local web server
        shell: bash
        run: |
          (cd .github/smoke && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &) || (cd .github/smoke && python -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:8099/ >/dev/null && break; sleep 1; done
      - uses: ./
        with:
          collection: .github/smoke/collection.json
          args: -u 2 -t 3s --threshold error_rate<1% --threshold requests>10
