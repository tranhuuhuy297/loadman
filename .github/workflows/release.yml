name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Built inside manylinux_2_28 (glibc 2.28) so the binaries run on RHEL 8,
  # Debian 10, Ubuntu 20.04 and newer; built on the runner itself they would
  # need the runner's much newer glibc.
  linux:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, image: quay.io/pypa/manylinux_2_28_x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, image: quay.io/pypa/manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the glibc requirement
        run: |
          needed=$(objdump -T target/${{ matrix.target }}/release/loadman | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "requires $needed"
          [ "$(printf '%s\n' "$needed" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ]
      - run: .github/scripts/package.sh ${{ github.ref_name }} ${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with:
          files: loadman-*.tar.gz

  other:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Intel macOS is cross-compiled; the Intel runners are retired.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: .github/scripts/package.sh ${{ github.ref_name }} ${{ matrix.target }}
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            loadman-*.tar.gz
            loadman-*.zip

  # Multi-arch image from the Linux release binaries.
  docker:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%%:*}-unknown-linux-gnu" platform="${pair##*:}"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "loadman-$TAG-$target.tar.gz"
            tar xzf "loadman-$TAG-$target.tar.gz"
            mkdir -p "dist/$platform"
            cp "loadman-$TAG-$target/loadman" "dist/$platform/"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Load testing for Postman collections
            org.opencontainers.image.licenses=MIT OR Apache-2.0

  # Points the Homebrew tap (<owner>/homebrew-tap) at this release. Needs a
  # HOMEBREW_TAP_TOKEN secret: a fine-grained token with read and write
  # access to the tap's contents. Without it the job only leaves a notice.
  homebrew:
    needs: [linux, other]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; update the tap with .github/scripts/formula.sh"
      - uses: actions/checkout@v5
        if: env.TAP_TOKEN != ''
      - name: Render the formula
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "loadman-$TAG-*.tar.gz" -D dist
          .github/scripts/formula.sh "$TAG" dist > loadman.rb
          cat loadman.rb
      - uses: actions/checkout@v5
        if: env.TAP_TOKEN != ''
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ env.TAP_TOKEN }}
          path: tap
      - name: Commit to the tap
        if: env.TAP_TOKEN != ''
        run: |
          cp loadman.rb tap/Formula/loadman.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/loadman.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "loadman ${TAG#v}"
          git push
